name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # .NET Framework 4.7.2 web projects need msbuild on a Windows runner.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - assignment1/assignment1/assignment1.sln
          - lab-task-3/College Management/College Management.sln
          - zerohunger/zerohunger.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore "${{ matrix.solution }}"

      - name: Build
        run: msbuild "${{ matrix.solution }}" /p:Configuration=Release /m
